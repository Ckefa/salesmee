root = "."
tmp_dir = "tmp"

[build]
  cmd = "go test ./... -count=1 && go vet ./... && go build -o ./tmp/main ."
  entrypoint = "cmd/server/main.go"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "web/static/css/dist"]
  include_dir = []
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = false
  kill_delay = 500

[log]
  main_only = false

[misc]
  clean_on_exit = true
