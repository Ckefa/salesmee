upstream salesmee {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default  "upgrade";
    ""       "";
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name salesmee.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name salesmee.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/salesmee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmee.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_tickets  off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy    "camera=(), microphone=(), geolocation=()" always;

    # Upload limit
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # Open file cache — caches metadata for static file lookups
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Logs
    access_log /var/log/nginx/salesmee_access.log;
    error_log  /var/log/nginx/salesmee_error.log warn;

    # Dynamic content — no cache, WebSocket passthrough
    location / {
        proxy_pass http://salesmee;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering        off;
        proxy_buffer_size      4k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static assets — aggressive browser cache
    # CSS/JS/images are versioned by filename or built with unique names
    location /static/ {
        proxy_pass http://salesmee;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_cache_valid 200 7d;

        add_header Cache-Control "public, immutable, max-age=604800" always;
        expires 7d;
    }

    # User uploads — shorter cache, no immutable (they get replaced)
    location /static/uploads/ {
        proxy_pass http://salesmee;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_cache_valid 200 1d;

        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
    }

    # Deny hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # robots.txt
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
}
