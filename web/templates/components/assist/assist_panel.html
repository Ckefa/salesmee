{{define "assist_panel"}}
{{if .AssistEnabled}}
<div id="assistBackdrop" class="assist-backdrop hidden" onclick="closeAssist()"></div>

<div id="assistButton" onclick="toggleAssist()" class="assist-btn" title="salesmee Assist">
  <i class="fas fa-wand-magic-sparkles"></i>
  <span class="assist-btn-glow"></span>
  <span class="assist-btn-sparkle assist-btn-sparkle-1">✦</span>
  <span class="assist-btn-sparkle assist-btn-sparkle-2">✦</span>
</div>

<div id="assistPanel" class="assist-panel hidden">
  <div class="assist-header assist-header-glow">
    <span class="assist-header-star assist-header-star-1">✦</span>
    <span class="assist-header-star assist-header-star-2">✦</span>
    <span class="assist-header-star assist-header-star-3">✦</span>
    <div class="assist-header-content">
      <div class="assist-header-icon">
        <i class="fas fa-wand-magic-sparkles text-xs"></i>
      </div>
      <div>
        <p class="text-sm font-semibold assist-header-title">salesmee Assist</p>
        <p class="assist-header-subtitle">AI-powered business assistant</p>
      </div>
    </div>
    <button onclick="closeAssist()" class="assist-close" title="Close">
      <i class="fas fa-times text-xs"></i>
    </button>
  </div>

  <div id="assistMessages" class="assist-messages">
    <div class="assist-empty">
      <i class="fas fa-wand-magic-sparkles text-2xl mb-2 assist-empty-icon"></i>
      <p class="text-sm font-medium assist-empty-text">How can I help you?</p>
      <p class="text-xs assist-empty-hint">Ask me to draft replies, suggest products, or help with SalesMee.</p>
    </div>
  </div>

  <div id="assistSuggestions" class="assist-suggestions">
  </div>

  <div class="assist-input-area">
    <input id="assistInput" type="text" class="assist-input" placeholder="Ask me anything..." onkeydown="onAssistKeydown(event)" autocomplete="off">
    <button onclick="var i=document.getElementById('assistInput');if(i)sendAssistMessage(i.value)" class="assist-send" title="Send">
      <i class="fas fa-paper-plane text-xs"></i>
    </button>
  </div>
</div>
{{end}}
{{end}}
