{{define "chat_header"}}
<div class="bg-[var(--color-surface)] border-b border-[var(--color-border)]">
  <div class="px-4 sm:px-6 py-2.5 sm:py-3">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 sm:space-x-3 min-w-0 flex-1">
        <div class="w-9 h-9 sm:w-10 sm:h-10 bg-[var(--color-primary-light)] rounded-full flex items-center justify-center shrink-0">
          <i class="fas fa-user text-[var(--color-primary)] text-sm sm:text-base"></i>
        </div>
        <div class="min-w-0">
          <h2 class="font-semibold text-sm sm:text-base text-[var(--color-text)] truncate">{{.Customer.Name}}</h2>
          <p class="text-xs sm:text-sm text-[var(--color-text-secondary)] truncate hide-mobile">{{.Customer.Email}}</p>
        </div>
      </div>
      <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
        <div class="flex items-center space-x-1 mr-1 sm:mr-2">
          {{if .Customer.IsOnline}}
          <div class="w-2 h-2 bg-green-500 rounded-full shrink-0"></div>
          <span class="text-xs text-green-600 hide-mobile">Online</span>
          {{else}}
          <div class="w-2 h-2 bg-[var(--color-text-muted)] rounded-full shrink-0"></div>
          <span class="text-xs text-[var(--color-text-secondary)] hide-mobile">Offline</span>
          {{if .Customer.LastSeenAt}}
          <span class="text-xs text-[var(--color-text-muted)] hide-mobile">• {{.Customer.LastSeenAt.Format "3:04 PM"}}</span>
          {{end}}
          {{end}}
        </div>
        <!-- Search Messages -->
        <button onclick="toggleMessageSearch()"
          class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-[var(--color-text-muted)] hover:bg-[var(--color-surface-secondary)] hover:text-[var(--color-text-secondary)] transition-colors"
          title="Search messages">
          <i class="fas fa-search text-xs sm:text-sm"></i>
        </button>
        <!-- Customer Info (Split View) -->
        <button onclick="toggleCustomerInfo()"
          class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-[var(--color-text-muted)] hover:bg-[var(--color-surface-secondary)] hover:text-[var(--color-text-secondary)] transition-colors"
          title="Customer details">
          <i class="fas fa-info-circle text-xs sm:text-sm"></i>
        </button>
        <!-- Analytics/Progress -->
        <button data-client-id="{{.Customer.ID}}"
          class="progress-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center bg-[var(--color-info-light)] text-[var(--color-info)] hover:bg-[var(--color-info-light)] transition-colors"
          title="Conversation progress">
          <i class="fas fa-chart-line text-xs sm:text-sm"></i>
        </button>
      </div>
    </div>
  </div>
  <!-- Message Search Bar (hidden by default) -->
  <div id="messageSearchBar" class="hidden px-4 sm:px-6 pb-3">
    <div class="relative">
      <input type="text" id="messageSearchInput" placeholder="Search messages..."
        oninput="filterMessages(this.value)"
        class="w-full pl-9 pr-3 py-2 bg-[var(--color-surface-secondary)] rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:bg-[var(--color-surface)] text-sm transition-all">
      <i class="fas fa-search absolute left-3 top-2.5 text-[var(--color-text-muted)] text-sm"></i>
      <button onclick="clearMessageSearch()" class="absolute right-3 top-2.5 text-[var(--color-text-muted)] hover:text-[var(--color-text-secondary)] text-sm">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="text-xs text-[var(--color-text-muted)] mt-1 px-1">
      <span id="searchResultCount">0</span> results found
    </div>
  </div>
</div>
{{end}}
