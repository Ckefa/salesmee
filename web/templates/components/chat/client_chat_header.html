{{define "client_chat_header"}}
<div class="wa-chat-header">
  <button onclick="clientBackFromChat()" class="wa-chat-back" title="Back">
    {{heroicon "arrow-left"}}
  </button>
  <div class="wa-chat-header-avatar">
    {{if .Business.Logo}}
    <img src="/static/{{.Business.Logo}}" alt="{{.Business.Name}}" class="wa-chat-avatar" loading="lazy" width="40" height="40">
    {{else}}
    <div class="wa-chat-avatar wa-sidebar-avatar-placeholder">{{heroicon "building-storefront"}}</div>
    {{end}}
  </div>
  <div class="wa-chat-header-info">
    <div class="wa-chat-header-name">{{.Business.Name}}</div>
    <div class="wa-chat-header-status flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 bg-[var(--color-success)] rounded-full"></span>
      <span>{{.Business.BusinessType}}</span>
    </div>
  </div>
  <div class="flex items-center gap-1 ml-auto">
    <button class="client-tab active" data-tab="chats"
      onclick="switchToChats({{.Business.ID}})">
      {{heroicon "chat-bubble-left-ellipsis"}}
      <span>Chats</span>
    </button>
    <button class="client-tab" data-tab="products"
      hx-get="/client/businesses/{{.Business.ID}}/products-page" hx-target="#chat-content" hx-swap="innerHTML"
      onclick="setClientActiveTab(this)">
      {{heroicon "cube"}}
      <span>Products</span>
    </button>
    <button class="client-tab" data-tab="services"
      hx-get="/client/businesses/{{.Business.ID}}/services-page" hx-target="#chat-content" hx-swap="innerHTML"
      onclick="setClientActiveTab(this)">
      {{heroicon "bell"}}
      <span>Services</span>
    </button>
  </div>
</div>
{{end}}
