{{define "client_message_input"}}
<div class="wa-input-wrapper border-t border-[var(--color-border)]">
  <form id="message-form" hx-post="/client/businesses/{{.Business.ID}}/messages" hx-target="#messages-container"
    hx-swap="none" hx-on::after-request="confirmSend(event); this.reset(); scrollMessagesToBottom()" hx-encoding="multipart/form-data" hx-on::before-request="validateAndOptimisticSend(event)">
    <div class="wa-input-inner">
      <div class="relative" id="media-tray-container">
        <button type="button" onclick="toggleMediaTray()" class="wa-input-icon-btn" title="Attach">
          <span id="media-icon">{{heroicon "plus"}}</span>
        </button>
        <div id="media-tray" class="hidden wa-media-tray">
          <button type="button" onclick="triggerMediaUpload('image')" class="wa-media-option">
            {{heroicon "photo" "text-blue-500"}}
            <span>Photos & Videos</span>
          </button>
          <button type="button" onclick="triggerMediaUpload('document')" class="wa-media-option">
            {{heroicon "document-text" "text-amber-500"}}
            <span>Document</span>
          </button>
          <button type="button" onclick="triggerMediaUpload('audio')" class="wa-media-option">
            {{heroicon "microphone" "text-rose-500"}}
            <span>Voice Note</span>
          </button>
        </div>
      </div>
      <input type="text" name="content" id="messageInput" placeholder="Type a message"
        class="wa-text-input" autocomplete="off" oninput="onMessageInput(this)" onkeydown="onMessageKeydown(event)">
      <input type="hidden" name="sender" value="client">
      <button type="submit" class="wa-send-btn" title="Send" id="sendBtn">
        {{heroicon "paper-airplane"}}
      </button>
    </div>
    <input type="file" name="media_image" id="media-input-image" accept="image/*" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_document" id="media-input-document" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_audio" id="media-input-audio" accept="audio/*" class="hidden" onchange="handleMediaSelected(this)">
  </form>
</div>
{{end}}
