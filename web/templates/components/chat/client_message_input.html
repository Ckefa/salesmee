{{define "client_message_input"}}
<div class="bg-[var(--color-surface)] border-t border-[var(--color-border)] p-4" style="position: sticky; bottom: 0;">
  <div class="flex space-x-2 mb-3">
    <button onclick="openClientProductPicker()"
      class="bg-[var(--color-info)] hover:opacity-90 text-white px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
      <i class="fas fa-shopping-cart"></i>
      <span>Place Order</span>
    </button>
    <button onclick="openClientServicePicker()"
      class="bg-[var(--color-secondary)] hover:opacity-90 text-white px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
      <i class="fas fa-concierge-bell"></i>
      <span>Request Service</span>
    </button>
  </div>

  <form id="message-form" hx-post="/client/businesses/{{.Business.ID}}/messages" hx-target="#messages-container"
    hx-swap="beforeend" hx-on::after-request="this.reset()">
    <div class="flex space-x-3">
      <input type="text" name="content" placeholder="Type a message..."
        class="input flex-1"
        required>
      <input type="hidden" name="sender" value="client">
      <button type="submit" class="bg-[var(--color-primary)] text-white px-6 py-2 rounded-lg hover:opacity-90">
        <i class="fas fa-paper-plane"></i> Send
      </button>
    </div>
  </form>
</div>
{{end}}
