{{define "client_text_message"}}
{{$isClient := eq .Sender "client"}}
<div class="msg {{if $isClient}}out{{else}}in{{end}} message-item" data-message-id="{{.ID}}">
  <div class="msg-bbl">
    {{if $isClient}}
    <svg class="msg-tail" viewBox="0 0 10 15" height="15" width="10" preserveAspectRatio="xMidYMid meet">
      <path fill="var(--color-bg)" d="M9,3L0,14V1H7C8.5,1,9.5,2,9,3z"></path>
      <path fill="currentColor" d="M9,2L0,13V0H7C8.5,0,9.5,1,9,2z"></path>
    </svg>
    {{else}}
    <svg class="msg-tail" viewBox="0 0 10 15" height="15" width="10" preserveAspectRatio="xMidYMid meet">
      <path fill="var(--color-bg)" d="M1,3L10,14V1H3C1.5,1,0.5,2,1,3z"></path>
      <path fill="currentColor" d="M1,2L10,13V0H3C1.5,0,0.5,1,1,2z"></path>
    </svg>
    {{end}}
    {{if .Value}}<span class="msg-txt">{{.Value}}</span>{{end}}
    <span class="msg-meta">
      <span class="msg-time">{{.CreatedAt.Format "3:04 PM"}}</span>
    </span>
  </div>
</div>
{{end}}
