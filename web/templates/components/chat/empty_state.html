{{define "empty_state"}}
<div class="wa-empty-state">
  <div class="bg-white rounded-xl p-1.5 inline-block mx-auto mb-4">
    <img src="/static/images/salesmee.svg" alt="SalesMee" class="h-10 sm:h-12" width="40" height="40">
  </div>
  <h2 class="wa-empty-state-title">SalesMee</h2>
  <p class="wa-empty-state-text">Send and receive messages, Track Orders, Bookings and payments from clients in one Platform.</p>
  <div class="wa-empty-state-hint">
    {{heroicon "lock" "text-[10px]" "mr-1"}}
    Messages are end-to-end encrypted.
  </div>
</div>
{{end}}

{{define "skeleton_chat"}}
<div class="flex flex-col h-full">
  <div class="flex items-center gap-2.5 px-4 py-[10px] border-b border-[var(--color-border)]" style="min-height:60px">
    <div class="skeleton rounded-full w-9 h-9 shrink-0"></div>
    <div class="flex-1 space-y-1.5">
      <div class="skeleton skeleton-text w-28 h-3.5"></div>
      <div class="skeleton skeleton-text w-16 h-2.5"></div>
    </div>
    <div class="skeleton rounded-lg w-8 h-8 shrink-0"></div>
    <div class="skeleton rounded-lg w-8 h-8 shrink-0"></div>
  </div>
  <div class="flex-1 p-4 space-y-4">
    <div class="skeleton skeleton-card"></div>
    <div class="flex justify-end"><div class="skeleton skeleton-card" style="width:60%"></div></div>
    <div class="flex"><div class="skeleton skeleton-card" style="width:70%"></div></div>
    <div class="flex justify-end"><div class="skeleton skeleton-card" style="width:45%"></div></div>
    <div class="flex"><div class="skeleton skeleton-card" style="width:55%"></div></div>
    <div class="flex justify-end"><div class="skeleton skeleton-card" style="width:65%"></div></div>
  </div>
</div>
{{end}}
