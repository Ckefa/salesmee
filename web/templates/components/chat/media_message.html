{{define "media_message"}}
<div class="wa-message {{if eq .Sender "business"}}wa-message-self{{else}}wa-message-other{{end}} message-item" data-message-text="{{.Value}}">
  <div class="wa-bubble wa-bubble-media">
    {{if eq .MediaType "image"}}
    <img src="/static/{{.MediaURL}}" alt="Image" class="wa-media-image" onclick="window.open(this.src)" loading="lazy">
    {{else if eq .MediaType "document"}}
    <div class="wa-media-doc">
      <i class="fas fa-file-alt wa-media-doc-icon"></i>
      <a href="/static/{{.MediaURL}}" target="_blank" class="wa-media-doc-link">{{if .Value}}{{.Value}}{{else}}Document{{end}}</a>
      <i class="fas fa-external-link-alt wa-media-doc-ext"></i>
    </div>
    {{else if eq .MediaType "audio"}}
    <div class="wa-media-audio">
      <audio controls class="wa-audio-player" preload="metadata">
        <source src="/static/{{.MediaURL}}">
      </audio>
    </div>
    {{end}}
    {{if .Value}}
    <div class="wa-bubble-text wa-bubble-media-caption">{{.Value}}</div>
    {{end}}
    <div class="wa-bubble-meta">
      <span class="wa-bubble-time">{{.CreatedAt.Format "3:04 PM"}}</span>
      {{if eq .Sender "business"}}
      <span class="wa-bubble-status"><i class="fas fa-check"></i></span>
      {{end}}
    </div>
  </div>
</div>
{{end}}
