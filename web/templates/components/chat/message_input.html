{{define "message_input"}}
<div class="bg-[var(--color-surface)] border-t border-[var(--color-border)] px-4 pt-4 pb-0 lg:pb-4">
  <div class="flex flex-wrap gap-2 mb-3">
    <button onclick="openBusinessProductPicker({{.Customer.ID}})"
      class="bg-[var(--color-primary)] hover:opacity-90 text-white px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
      <i class="fas fa-box"></i>
      <span>Products</span>
    </button>
    <button onclick="openServicePicker({{.Customer.ID}})"
      class="bg-[var(--color-secondary)] hover:opacity-90 text-white px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
      <i class="fas fa-concierge-bell"></i>
      <span>Services</span>
    </button>
    <button onclick="openPaymentModal({{.Customer.ID}})"
      class="bg-[var(--color-accent)] hover:opacity-90 text-white px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
      <i class="fas fa-credit-card"></i>
      <span>Payment</span>
    </button>
  </div>

  <form id="message-form" hx-post="clients/{{.Customer.ID}}/messages" hx-target="#messages-container"
    hx-swap="beforeend" hx-on::after-request="this.reset()" hx-encoding="multipart/form-data">
    <div class="flex space-x-3">
      <div class="relative" id="media-tray-container">
        <button type="button" onclick="toggleMediaTray()"
          class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-text-muted)] text-[var(--color-text-secondary)] w-10 h-10 rounded-full flex items-center justify-center transition-colors shrink-0">
          <i class="fas fa-paperclip" id="media-icon"></i>
        </button>
        <div id="media-tray" class="absolute bottom-12 left-0 space-y-2 hidden">
          <div class="flex gap-2 bg-[var(--color-surface)] p-2 rounded-xl shadow-xl border border-[var(--color-border)]">
            <button type="button" onclick="triggerMediaUpload('image')"
              class="flex flex-col items-center gap-1 p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[80px]">
              <i class="fas fa-image text-blue-500 text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Images</span>
            </button>
            <button type="button" onclick="triggerMediaUpload('document')"
              class="flex flex-col items-center gap-1 p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[80px]">
              <i class="fas fa-file-alt text-amber-500 text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Documents</span>
            </button>
            <button type="button" onclick="triggerMediaUpload('audio')"
              class="flex flex-col items-center gap-1 p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[80px]">
              <i class="fas fa-microphone text-rose-500 text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Voice Note</span>
            </button>
          </div>
        </div>
      </div>
      <input type="text" name="content" id="messageInput" placeholder="Type a message... (/ for quick replies)"
        oninput="onMessageInput(this)"
        onkeydown="onMessageKeydown(event)"
        class="input flex-1"
        required>
      <input type="hidden" name="sender" value="business">
      <button type="submit" class="bg-[var(--color-primary)] text-white px-6 py-2 rounded-lg hover:opacity-90">
        <i class="fas fa-paper-plane"></i> Send
      </button>
    </div>
    <input type="file" name="media_image" id="media-input-image" accept="image/*" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_document" id="media-input-document" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_audio" id="media-input-audio" accept="audio/*" class="hidden" onchange="handleMediaSelected(this)">
  </form>
</div>
{{end}}
