{{define "message_input"}}
<div class="bg-[var(--color-surface)] border-t border-[var(--color-border)] px-3 sm:px-4 pt-3 sm:pt-4 pb-0 lg:pb-4">
  <div class="flex flex-wrap gap-1.5 sm:gap-2 mb-2 sm:mb-3">
    <button onclick="openBusinessProductPicker({{.Customer.ID}})"
      class="bg-[var(--color-primary)] hover:opacity-90 text-white px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-1">
      <i class="fas fa-box text-xs sm:text-sm"></i>
      <span>Products</span>
    </button>
    <button onclick="openServicePicker({{.Customer.ID}})"
      class="bg-[var(--color-secondary)] hover:opacity-90 text-white px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-1">
      <i class="fas fa-concierge-bell text-xs sm:text-sm"></i>
      <span>Services</span>
    </button>
    <a href="/business/payments"
      class="bg-[var(--color-accent)] hover:opacity-90 text-white px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-1 no-underline">
      <i class="fas fa-credit-card text-xs sm:text-sm"></i>
      <span>Payments</span>
    </a>
  </div>

  <form id="message-form" hx-post="clients/{{.Customer.ID}}/messages" hx-target="#messages-container"
    hx-swap="beforeend" hx-on::after-request="this.reset()" hx-encoding="multipart/form-data">
    <div class="flex space-x-2 sm:space-x-3">
      <div class="relative" id="media-tray-container">
        <button type="button" onclick="toggleMediaTray()"
          class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-text-muted)] text-[var(--color-text-secondary)] w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors shrink-0">
          <i class="fas fa-paperclip text-sm sm:text-base" id="media-icon"></i>
        </button>
        <div id="media-tray" class="absolute bottom-12 left-0 space-y-2 hidden">
          <div class="flex gap-2 bg-[var(--color-surface)] p-1.5 sm:p-2 rounded-xl shadow-xl border border-[var(--color-border)]">
            <button type="button" onclick="triggerMediaUpload('image')"
              class="flex flex-col items-center gap-1 p-2 sm:p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[60px] sm:min-w-[80px]">
              <i class="fas fa-image text-blue-500 text-lg sm:text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Images</span>
            </button>
            <button type="button" onclick="triggerMediaUpload('document')"
              class="flex flex-col items-center gap-1 p-2 sm:p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[60px] sm:min-w-[80px]">
              <i class="fas fa-file-alt text-amber-500 text-lg sm:text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Documents</span>
            </button>
            <button type="button" onclick="triggerMediaUpload('audio')"
              class="flex flex-col items-center gap-1 p-2 sm:p-3 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-colors min-w-[60px] sm:min-w-[80px]">
              <i class="fas fa-microphone text-rose-500 text-lg sm:text-xl"></i>
              <span class="text-xs text-[var(--color-text-secondary)]">Voice Note</span>
            </button>
          </div>
        </div>
      </div>
      <input type="text" name="content" id="messageInput" placeholder="Type a message... (/ for quick replies)"
        oninput="onMessageInput(this)"
        onkeydown="onMessageKeydown(event)"
        class="input flex-1 text-sm"
        required>
      <input type="hidden" name="sender" value="business">
      <button type="submit" class="bg-[var(--color-primary)] text-white px-4 sm:px-6 py-2 rounded-lg hover:opacity-90 text-sm">
        <i class="fas fa-paper-plane"></i> Send
      </button>
    </div>
    <input type="file" name="media_image" id="media-input-image" accept="image/*" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_document" id="media-input-document" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx" class="hidden" onchange="handleMediaSelected(this)">
    <input type="file" name="media_audio" id="media-input-audio" accept="audio/*" class="hidden" onchange="handleMediaSelected(this)">
  </form>
</div>
{{end}}
