{{define "client_booking"}}
<div id="clientBookingModal" class="fixed inset-0 bg-black/50 hidden overflow-y-auto h-full w-full z-50">
  <div class="relative top-10 sm:top-20 mx-auto p-4 sm:p-5 border w-full max-w-md mx-3 sm:mx-4 shadow-lg rounded-md bg-[var(--color-surface)]">
    <div class="mt-2 sm:mt-3">
      <h3 class="text-base sm:text-lg font-medium text-[var(--color-text)]">Request Booking</h3>
      <form id="clientBookingForm" class="mt-3 sm:mt-4 space-y-3 sm:space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-medium text-[var(--color-text)]">Select Service</label>
          <select id="clientBookingService" required
            class="input mt-1 text-sm">
            <option value="">Choose a service...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-medium text-[var(--color-text)]">Date</label>
          <input type="date" id="clientBookingDate" required
            class="input mt-1 text-sm">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-medium text-[var(--color-text)]">Time</label>
          <input type="time" id="clientBookingTime" required
            class="input mt-1 text-sm">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-medium text-[var(--color-text)]">Notes</label>
          <textarea id="clientBookingNotes" rows="2" placeholder="Any special requests..."
            class="input mt-1 text-sm"></textarea>
        </div>
        <div class="flex justify-end space-x-2 sm:space-x-3 pt-3 sm:pt-4">
          <button type="button" onclick="hideClientBookingModal()"
            class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-surface-tertiary)] text-[var(--color-text)] px-3 sm:px-4 py-1.5 sm:py-2 rounded text-sm">
            Cancel
          </button>
          <button type="submit" class="bg-[var(--color-secondary)] hover:opacity-90 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded text-sm">
            Send Booking Request
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{{end}}
