{{ define "client_order" }}
<!-- Client Order Modal -->
<div id="clientOrderModal" class="fixed inset-0 bg-black/50 hidden overflow-y-auto h-full w-full z-50">
  <div class="relative top-20 mx-auto p-5 border w-full max-w-md mx-4 shadow-lg rounded-md bg-[var(--color-surface)]">
    <div class="mt-3">
      <h3 class="text-lg font-medium text-[var(--color-text)]">Place Order</h3>
      <form id="clientOrderForm" class="mt-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Select Product</label>
          <select id="clientOrderProduct" required
            class="input mt-1">
            <option value="">Choose a product...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Quantity</label>
          <input type="number" id="clientOrderQuantity" min="1" value="1" required
            class="input mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Delivery Address</label>
          <textarea id="clientOrderAddress" rows="2" placeholder="Enter delivery address..."
            class="input mt-1"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Notes</label>
          <textarea id="clientOrderNotes" rows="2" placeholder="Any special requests..."
            class="input mt-1"></textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="hideClientOrderModal()"
            class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-surface-tertiary)] text-[var(--color-text)] px-4 py-2 rounded">
            Cancel
          </button>
          <button type="button" onclick="console.log('Dashboard button clicked!'); submitOrderForm()"
            class="bg-[var(--color-info)] hover:opacity-90 text-white px-4 py-2 rounded">
            Send Order Request
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
