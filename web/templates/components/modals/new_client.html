{{ define "new-client"}}

<!-- New Client Modal -->
<div id="new-client-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-[var(--color-surface)] rounded-lg p-4 sm:p-5 w-full max-w-md mx-3 sm:mx-4">
    <h2 class="text-xl font-semibold mb-4 text-[var(--color-text)]">Add New Customer</h2>
    <form id="new-client-form">
      <div class="mb-4">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">Name *</label>
        <input type="text" name="name" required
          class="input">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">Email</label>
        <input type="email" name="email"
          class="input">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">Phone</label>
        <input type="tel" name="phone"
          class="input">
      </div>
      <div class="flex justify-end space-x-3">
        <button type="button" onclick="hideNewClientModal()"
          class="btn btn-sm btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-sm btn-primary">Add
          Customer</button>
      </div>
    </form>
  </div>
</div>


{{end}}
