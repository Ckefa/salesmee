{{define "payment_method_modal"}}
<div id="paymentMethodModal" class="fixed inset-0 bg-black/50 hidden z-[60] flex items-start sm:items-center justify-center p-4 overflow-y-auto">
  <div class="relative w-full max-w-lg bg-[var(--color-surface)] rounded-xl shadow-xl p-5 my-4 sm:my-auto">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-[var(--color-text)]" id="paymentMethodModalTitle">Add Payment Method</h3>
      <button onclick="hidePaymentMethodModal()" class="text-[var(--color-text-muted)] hover:text-[var(--color-text)]">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form id="paymentMethodForm" class="space-y-4">
      <input type="hidden" id="pmEditId" value="">

      <div>
        <label class="block text-sm font-medium text-[var(--color-text)]">Method Type</label>
        <select id="pmType" onchange="onPaymentMethodTypeChange()" class="input mt-1 text-sm" required>
          <option value="">Select type...</option>
          <option value="bank">🏦 Bank Transfer</option>
          <option value="mobile_wallet">📱 Mobile Wallet</option>
          <option value="paypal">💳 PayPal</option>
          <option value="link">🔗 Payment Link</option>
          <option value="crypto">₿ Cryptocurrency</option>
          <option value="custom">✏️ Custom</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-[var(--color-text)]">Label</label>
        <input type="text" id="pmLabel" class="input mt-1 text-sm" placeholder="e.g. Equity Bank, M-Pesa, Bitcoin" required>
      </div>

      <div id="pmSortOrderWrap">
        <label class="block text-sm font-medium text-[var(--color-text)]">Sort Order</label>
        <input type="number" id="pmSortOrder" class="input mt-1 text-sm" value="0" min="0" style="width:100px">
      </div>

      <!-- Bank fields -->
      <div id="pmBankFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Account Name</label>
          <input type="text" id="pmBankAccountName" class="input mt-1 text-sm" placeholder="Account holder name">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Account Number</label>
          <input type="text" id="pmBankAccountNumber" class="input mt-1 text-sm" placeholder="Local account number">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">IBAN (optional)</label>
          <input type="text" id="pmBankIban" class="input mt-1 text-sm" placeholder="e.g. GB29 NWBK 6016 1331 9268 19">
          <p class="text-[10px] text-[var(--color-text-muted)] mt-0.5">For international / SEPA transfers</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Bank Name</label>
          <input type="text" id="pmBankName" class="input mt-1 text-sm" placeholder="e.g. Equity Bank, KCB">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-sm font-medium text-[var(--color-text)]">Branch Code (optional)</label>
            <input type="text" id="pmBankBranchCode" class="input mt-1 text-sm" placeholder="Branch code">
          </div>
          <div>
            <label class="block text-sm font-medium text-[var(--color-text)]">SWIFT/BIC (optional)</label>
            <input type="text" id="pmBankSwiftCode" class="input mt-1 text-sm" placeholder="SWIFT code">
          </div>
          <div>
            <label class="block text-sm font-medium text-[var(--color-text)]">Sort Code (optional)</label>
            <input type="text" id="pmBankSortCode" class="input mt-1 text-sm" placeholder="e.g. 60-16-13">
          </div>
        </div>
      </div>

      <!-- Mobile Wallet fields -->
      <div id="pmMobileWalletFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Region / Provider</label>
          <select id="pmMobileWalletProvider" onchange="onMobileWalletProviderChange()" class="input mt-1 text-sm">
            <option value="">Select provider...</option>
            <optgroup label="Africa">
              <option value="M-Pesa">M-Pesa</option>
              <option value="Airtel Money">Airtel Money</option>
              <option value="MTN Mobile Money">MTN Mobile Money</option>
              <option value="Vodafone Cash">Vodafone Cash</option>
              <option value="Orange Money">Orange Money</option>
              <option value="Tigo Cash">Tigo Cash</option>
              <option value="MoMo">MoMo (MTN)</option>
            </optgroup>
            <optgroup label="India">
              <option value="Google Pay (Tez)">Google Pay (Tez)</option>
              <option value="PhonePe">PhonePe</option>
              <option value="Paytm">Paytm</option>
              <option value="BHIM UPI">BHIM UPI</option>
              <option value="Amazon Pay">Amazon Pay</option>
              <option value="CRED">CRED</option>
            </optgroup>
            <optgroup label="USA">
              <option value="Venmo">Venmo</option>
              <option value="Cash App">Cash App</option>
              <option value="Zelle">Zelle</option>
              <option value="Apple Pay">Apple Pay</option>
              <option value="Google Pay">Google Pay</option>
            </optgroup>
            <optgroup label="Southeast Asia">
              <option value="GrabPay">GrabPay (Malaysia/PH)</option>
              <option value="GoPay">GoPay (Indonesia)</option>
              <option value="TrueMoney">TrueMoney (Thailand)</option>
              <option value="GCash">GCash (Philippines)</option>
              <option value="Maya">Maya (Philippines)</option>
              <option value="DANA">DANA (Indonesia)</option>
            </optgroup>
            <optgroup label="Brazil">
              <option value="Pix">Pix</option>
            </optgroup>
            <optgroup label="China">
              <option value="Alipay">Alipay</option>
              <option value="WeChat Pay">WeChat Pay</option>
            </optgroup>
            <optgroup label="Japan / Korea">
              <option value="PayPay">PayPay (Japan)</option>
              <option value="Line Pay">Line Pay (Japan)</option>
              <option value="KakaoPay">KakaoPay (Korea)</option>
              <option value="Naver Pay">Naver Pay (Korea)</option>
              <option value="Toss">Toss (Korea)</option>
            </optgroup>
            <optgroup label="Global">
              <option value="Revolut">Revolut</option>
              <option value="Wise">Wise</option>
              <option value="Skrill">Skrill</option>
              <option value="Neteller">Neteller</option>
              <option value="Payoneer">Payoneer</option>
              <option value="Other">Other</option>
            </optgroup>
          </select>
        </div>
        <div id="pmMobileWalletCustomWrap" class="hidden">
          <label class="block text-sm font-medium text-[var(--color-text)]">Custom Provider Name</label>
          <input type="text" id="pmMobileWalletCustomProvider" class="input mt-1 text-sm" placeholder="Enter provider name">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Phone / Account ID</label>
          <input type="text" id="pmMobileWalletPhone" class="input mt-1 text-sm" placeholder="Phone number, email, or account ID">
          <p class="text-[10px] text-[var(--color-text-muted)] mt-0.5">Phone number for most wallets, email for Venmo/Zelle, username for Cash App</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">UPI ID (optional)</label>
          <input type="text" id="pmMobileWalletUpi" class="input mt-1 text-sm" placeholder="e.g. user@upi (for India)">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Account Name</label>
          <input type="text" id="pmMobileWalletName" class="input mt-1 text-sm" placeholder="Account holder name">
        </div>
      </div>

      <!-- PayPal fields -->
      <div id="pmPaypalFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">PayPal Email</label>
          <input type="email" id="pmPaypalEmail" class="input mt-1 text-sm" placeholder="email@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">PayPal.Me Link (optional)</label>
          <input type="url" id="pmPaypalLink" class="input mt-1 text-sm" placeholder="https://paypal.me/yourname">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Description (optional)</label>
          <input type="text" id="pmPaypalDescription" class="input mt-1 text-sm" placeholder="e.g. Friends & Family">
        </div>
      </div>

      <!-- Link fields -->
      <div id="pmLinkFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">URL</label>
          <input type="url" id="pmLinkUrl" class="input mt-1 text-sm" placeholder="https://payment-link.com/pay">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Description (optional)</label>
          <input type="text" id="pmLinkDescription" class="input mt-1 text-sm" placeholder="e.g. Click to pay via our secure portal">
        </div>
      </div>

      <!-- Crypto fields -->
      <div id="pmCryptoFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Network</label>
          <select id="pmCryptoNetwork" class="input mt-1 text-sm">
            <option value="">Select network...</option>
            <option value="Bitcoin">Bitcoin (BTC)</option>
            <option value="Ethereum">Ethereum (ETH)</option>
            <option value="USDT-TRC20">USDT (TRC20)</option>
            <option value="USDT-ERC20">USDT (ERC20)</option>
            <option value="Solana">Solana (SOL)</option>
            <option value="BNB Smart Chain">BNB Smart Chain (BSC)</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Wallet Address</label>
          <input type="text" id="pmCryptoAddress" class="input mt-1 text-sm" placeholder="Wallet address">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Description (optional)</label>
          <input type="text" id="pmCryptoDescription" class="input mt-1 text-sm" placeholder="e.g. USDT only, no refunds">
        </div>
      </div>

      <!-- Custom fields -->
      <div id="pmCustomFields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Instructions</label>
          <textarea id="pmCustomContent" rows="4" class="input mt-1 text-sm" placeholder="Enter any payment instructions or details..."></textarea>
        </div>
      </div>

      <div id="pmFormError" class="text-red-500 text-sm hidden"></div>

      <div class="flex justify-end space-x-3 pt-4 border-t border-[var(--color-border)]">
        <button type="button" onclick="hidePaymentMethodModal()"
          class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-surface-tertiary)] text-[var(--color-text)] px-4 py-2 rounded-lg text-sm">
          Cancel
        </button>
        <button type="submit" id="pmSubmitBtn"
          class="bg-[var(--color-primary)] hover:opacity-90 text-white px-4 py-2 rounded-lg text-sm">
          <i class="fas fa-save mr-1"></i> Save Method
        </button>
      </div>
    </form>
  </div>
</div>
{{end}}
