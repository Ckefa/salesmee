{{define "quick-order"}}
<!-- Quick Order Modal -->
<div id="quickOrderModal" class="fixed inset-0 bg-black/50 hidden overflow-y-auto h-full w-full z-50">
  <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-[var(--color-surface)]">
    <div class="mt-3">
      <h3 class="text-lg font-medium text-[var(--color-text)]">Quick Order</h3>
      <form id="quickOrderForm" class="mt-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Select Product</label>
          <select id="orderProduct" required
            class="input mt-1">
            <option value="">Choose a product...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Quantity</label>
          <input type="number" id="orderQuantity" min="1" required
            class="input mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Name</label>
          <input type="text" id="orderCustomerName" required
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Email</label>
          <input type="email" id="orderCustomerEmail"
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Phone</label>
          <input type="tel" id="orderCustomerPhone"
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Delivery Address</label>
          <textarea id="orderDeliveryAddress" rows="2"
            class="input mt-1"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Notes</label>
          <textarea id="orderNotes" rows="2"
            class="input mt-1"></textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="hideQuickOrderModal()"
            class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-surface-tertiary)] text-[var(--color-text)] px-4 py-2 rounded">
            Cancel
          </button>
          <button type="submit" class="bg-[var(--color-info)] hover:opacity-90 text-white px-4 py-2 rounded">
            Create Order
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{{end}}
