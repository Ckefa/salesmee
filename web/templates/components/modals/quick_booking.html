{{define "quick-booking"}}
<!-- Quick Booking Modal -->
<div id="quickBookingModal" class="fixed inset-0 bg-black/50 hidden overflow-y-auto h-full w-full z-50">
  <div class="relative top-20 mx-auto p-5 border w-full max-w-md mx-4 shadow-lg rounded-md bg-[var(--color-surface)]">
    <div class="mt-3">
      <h3 class="text-lg font-medium text-[var(--color-text)]">Quick Booking</h3>
      <form id="quickBookingForm" class="mt-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Select Service</label>
          <select id="bookingService" required
            class="input mt-1">
            <option value="">Choose a service...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Name</label>
          <input type="text" id="bookingCustomerName" required
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Email</label>
          <input type="email" id="bookingCustomerEmail"
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Customer Phone</label>
          <input type="tel" id="bookingCustomerPhone"
            class="input mt-1"
            readonly>
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Booking Date</label>
          <input type="date" id="bookingDate" required
            class="input mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Booking Time</label>
          <input type="time" id="bookingTime" required
            class="input mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-[var(--color-text)]">Notes</label>
          <textarea id="bookingNotes" rows="2"
            class="input mt-1"></textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="hideQuickBookingModal()"
            class="bg-[var(--color-surface-tertiary)] hover:bg-[var(--color-surface-tertiary)] text-[var(--color-text)] px-4 py-2 rounded">
            Cancel
          </button>
          <button type="submit" class="bg-[var(--color-secondary)] hover:opacity-90 text-white px-4 py-2 rounded">
            Create Booking
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{{end}}
