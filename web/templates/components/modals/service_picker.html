{{define "service_picker"}}
<div id="servicePickerModal" class="fixed inset-0 bg-gray-900/50 hidden overflow-y-auto h-full w-full z-[60] backdrop-blur-sm">
  <div class="relative top-0 sm:top-8 mx-auto p-0 border w-full max-w-3xl shadow-2xl rounded-2xl bg-[var(--color-surface)] max-h-[calc(100dvh-64px)] sm:max-h-[90vh] flex flex-col">

    <!-- ====== HEADER ====== -->
    <div class="p-3 sm:p-5 border-b border-[var(--color-border)] flex items-center justify-between bg-gradient-to-r from-purple-500 to-pink-600 rounded-t-2xl text-white flex-shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0">
          <i class="fas fa-concierge-bell text-sm sm:text-lg"></i>
        </div>
        <div class="min-w-0">
          <h3 class="text-base sm:text-lg font-bold">
            <span id="servicePickerTitle">Book a Service</span>
          </h3>
          <p class="text-[10px] sm:text-xs text-white/80 mt-0.5" id="servicePickerCount">Loading services...</p>
        </div>
      </div>
      <button onclick="hideServicePicker()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition hover:scale-110 active:scale-95 flex-shrink-0">
        <i class="fas fa-times text-xs sm:text-sm"></i>
      </button>
    </div>

    <!-- ====== STEP INDICATOR ====== -->
    <div class="flex items-center justify-center gap-0 px-3 sm:px-6 py-2 sm:py-3 bg-[var(--color-surface-secondary)] border-b border-[var(--color-border)] flex-shrink-0">
      <div class="flex items-center gap-1 sm:gap-2">
        <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-[10px] sm:text-xs font-bold" id="svcStep1Indicator">1</span>
        <span class="text-[10px] sm:text-xs font-medium hide-mobile" id="svcStep1Label">Choose</span>
      </div>
      <div class="w-6 sm:w-12 h-px mx-1 sm:mx-2" id="svcStep1to2"></div>
      <div class="flex items-center gap-1 sm:gap-2">
        <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-[10px] sm:text-xs font-bold" id="svcStep2Indicator">2</span>
        <span class="text-[10px] sm:text-xs font-medium hide-mobile" id="svcStep2Label">Details</span>
      </div>
      <div class="w-6 sm:w-12 h-px mx-1 sm:mx-2" id="svcStep2to3"></div>
      <div class="flex items-center gap-1 sm:gap-2">
        <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-[10px] sm:text-xs font-bold" id="svcStep3Indicator">3</span>
        <span class="text-[10px] sm:text-xs font-medium hide-mobile" id="svcStep3Label">Confirm</span>
      </div>
    </div>

    <!-- ====== STEP 1: SERVICE GRID ====== -->
    <div id="servicePickerStep1" class="flex flex-col flex-1 min-h-0">
      <!-- Search -->
      <div class="p-3 sm:p-4 border-b border-[var(--color-border-light)] flex-shrink-0">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-2.5 sm:top-3 text-[var(--color-text-muted)] text-sm sm:text-base"></i>
          <input type="text" id="servicePickerSearch" placeholder="Search by name or category..."
            class="input pl-9 sm:pl-10 text-sm"
            oninput="filterPickerServices()">
          <button onclick="document.getElementById('servicePickerSearch').value='';filterPickerServices()" class="absolute right-3 top-2.5 sm:top-3 text-[var(--color-text-muted)] hover:text-[var(--color-text-secondary)] hidden" id="servicePickerSearchClear">
            <i class="fas fa-times-circle"></i>
          </button>
        </div>
      </div>

      <!-- Category Filters -->
      <div class="px-3 sm:px-4 pt-2 sm:pt-3 pb-1 flex-shrink-0 overflow-x-auto">
        <div class="flex gap-1.5 flex-wrap" id="servicePickerCategoryFilter"></div>
      </div>

      <!-- Service Grid -->
      <div class="flex-1 overflow-y-auto p-3 sm:p-4" id="servicePickerGrid">
        <div class="text-center py-10 sm:py-16 text-[var(--color-text-muted)]">
          <i class="fas fa-spinner fa-spin text-2xl sm:text-3xl mb-2 sm:mb-3"></i>
          <p class="text-xs sm:text-sm">Loading services...</p>
        </div>
      </div>
    </div>

    <!-- ====== STEP 2: BOOKING DETAILS ====== -->
    <div id="servicePickerStep2" class="hidden flex flex-col flex-1 min-h-0">
      <div class="flex-1 overflow-y-auto p-3 sm:p-5">
        <button onclick="backToServiceGrid()" class="text-xs sm:text-sm text-purple-600 hover:text-purple-800 flex items-center gap-1.5 mb-3 sm:mb-5 group">
          <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-purple-100 group-hover:bg-purple-200 flex items-center justify-center transition">
            <i class="fas fa-arrow-left text-[10px] sm:text-xs"></i>
          </span>
          <span class="font-medium">Back to services</span>
        </button>

        <!-- Selected Service Card -->
        <div class="bg-gradient-to-br from-purple-50 via-white to-pink-50 border border-purple-200 rounded-2xl p-3 sm:p-5 mb-4 sm:mb-6 relative overflow-hidden shadow-sm">
          <div class="absolute top-0 right-0 w-24 sm:w-32 h-24 sm:h-32 bg-purple-100 rounded-full -mr-12 -mt-12 opacity-30"></div>
          <div class="absolute bottom-0 left-0 w-16 sm:w-20 h-16 sm:h-20 bg-pink-100 rounded-full -ml-8 -mb-8 opacity-30"></div>
          <div class="flex items-center gap-3 sm:gap-4 relative z-10">
            <div id="selectedServiceImage" class="w-12 h-12 sm:w-16 sm:h-16 rounded-xl bg-[var(--color-surface)] shadow-sm flex items-center justify-center text-lg sm:text-2xl flex-shrink-0 overflow-hidden border border-[var(--color-border)]">
              <i class="fas fa-concierge-bell text-purple-600"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 id="selectedServiceName" class="font-bold text-sm sm:text-lg text-[var(--color-text)] truncate">Service Name</h4>
              <span id="selectedServiceCategory" class="text-[10px] sm:text-[11px] text-purple-500 bg-purple-100 px-1.5 sm:px-2 py-0.5 rounded inline-block mt-0.5"></span>
              <p class="text-xs sm:text-sm text-[var(--color-text-secondary)] mt-1">
                <span id="selectedServiceDuration" class="mr-2 sm:mr-3"></span>
                <span id="selectedServicePrice" class="font-semibold text-purple-700"></span>
              </p>
              <p id="selectedServiceDesc" class="text-[10px] sm:text-xs text-[var(--color-text-muted)] mt-1 line-clamp-2"></p>
            </div>
          </div>
        </div>

        <!-- Booking Form -->
        <form id="serviceBookingForm" class="space-y-3 sm:space-y-4">
          <input type="hidden" id="servicePickerServiceId">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div>
              <label class="block text-xs sm:text-sm font-semibold text-[var(--color-text)] mb-1 sm:mb-1.5">
                <i class="fas fa-calendar-day text-purple-500 mr-1"></i> Date
              </label>
              <input type="date" id="servicePickerDate" required
                class="input text-sm">
            </div>
            <div>
              <label class="block text-xs sm:text-sm font-semibold text-[var(--color-text)] mb-1 sm:mb-1.5">
                <i class="fas fa-clock text-purple-500 mr-1"></i> Time
              </label>
              <input type="time" id="servicePickerTime" required
                class="input text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs sm:text-sm font-semibold text-[var(--color-text)] mb-1 sm:mb-1.5">
              <i class="fas fa-pen text-purple-500 mr-1"></i> Notes <span class="text-[var(--color-text-muted)] font-normal">(optional)</span>
            </label>
            <textarea id="servicePickerNotes" rows="2" placeholder="Add any special requests or notes..."
              class="input resize-none text-sm"></textarea>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="border-t border-[var(--color-border)] p-3 sm:p-4 bg-[var(--color-surface)] rounded-b-2xl flex-shrink-0">
        <div class="flex gap-2 sm:gap-3">
          <button onclick="backToServiceGrid()" class="flex-1 py-2 sm:py-3 px-2 sm:px-4 rounded-xl border-2 border-[var(--color-border)] text-[var(--color-text-secondary)] hover:border-[var(--color-border)] hover:bg-[var(--color-surface-secondary)] text-xs sm:text-sm font-semibold transition active:scale-[0.98]">
            <i class="fas fa-arrow-left mr-1"></i> Change
          </button>
          <button onclick="servicePickerGoToStep(3)" class="flex-[2] py-2 sm:py-3 px-2 sm:px-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-600 text-white text-xs sm:text-sm font-bold shadow-lg shadow-purple-200 hover:from-purple-600 hover:to-pink-700 transition active:scale-[0.98]">
            Continue <i class="fas fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- ====== STEP 3: CONFIRMATION ====== -->
    <div id="servicePickerStep3" class="hidden flex flex-col flex-1 min-h-0">
      <div class="flex-1 overflow-y-auto p-3 sm:p-5">
        <button onclick="servicePickerGoToStep(2)" class="text-xs sm:text-sm text-purple-600 hover:text-purple-800 flex items-center gap-1.5 mb-3 sm:mb-5 group">
          <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-purple-100 group-hover:bg-purple-200 flex items-center justify-center transition">
            <i class="fas fa-arrow-left text-[10px] sm:text-xs"></i>
          </span>
          <span class="font-medium">Back to details</span>
        </button>

        <div class="flex items-center gap-1.5 sm:gap-2 mb-3 sm:mb-4">
          <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-purple-100 flex items-center justify-center">
            <i class="fas fa-check text-purple-600 text-[10px] sm:text-sm"></i>
          </div>
          <h4 class="text-sm sm:text-base font-bold text-[var(--color-text)]">Review & Confirm</h4>
        </div>

        <!-- Confirmation Card -->
        <div id="servicePickerConfirmInfo"></div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-2 sm:p-3 text-[10px] sm:text-xs text-amber-700 flex items-start gap-1.5 sm:gap-2">
          <i class="fas fa-info-circle mt-0.5"></i>
          <span id="servicePickerConfirmHint">
            <span class="font-semibold">You're almost done!</span> Review the details above before submitting your request.
          </span>
        </div>
      </div>

      <!-- Footer -->
      <div class="border-t border-[var(--color-border)] p-3 sm:p-4 bg-[var(--color-surface)] rounded-b-2xl flex-shrink-0">
        <div class="flex gap-2 sm:gap-3">
          <button onclick="servicePickerGoToStep(2)" class="flex-1 py-2 sm:py-3 px-2 sm:px-4 rounded-xl border-2 border-[var(--color-border)] text-[var(--color-text-secondary)] hover:border-[var(--color-border)] hover:bg-[var(--color-surface-secondary)] text-xs sm:text-sm font-semibold transition active:scale-[0.98]">
            <i class="fas fa-arrow-left mr-1"></i> Edit Details
          </button>
          <button id="servicePickerSubmitBtn" onclick="submitServiceBooking()"
            class="flex-[2] py-2 sm:py-3 px-2 sm:px-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-600 text-white text-xs sm:text-sm font-bold shadow-lg shadow-purple-200 hover:from-purple-600 hover:to-pink-700 transition active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
            <i class="fas fa-calendar-check mr-1"></i> Create Booking
          </button>
        </div>
        <p class="text-[10px] text-[var(--color-text-muted)] text-center mt-1.5 sm:mt-2">
          <i class="fas fa-info-circle mr-0.5"></i>
          <span id="servicePickerSubmitHint">The business will confirm your booking</span>
        </p>
      </div>
    </div>

  </div>
</div>
{{end}}
