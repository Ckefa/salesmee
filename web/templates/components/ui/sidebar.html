{{ define "biz-sidebar" }}
<aside class="wa-sidebar" id="bizSidebar">
  <div class="wa-sidebar-header">
    {{if .Business.Logo}}
    <img src="/static/{{.Business.Logo}}" class="wa-sidebar-avatar">
    {{else}}
    <div class="wa-sidebar-avatar wa-sidebar-avatar-placeholder"><i class="fas fa-store"></i></div>
    {{end}}
    <div class="wa-sidebar-header-info">
      <h2 class="wa-sidebar-business-name">{{.Business.Name}}</h2>
      <span class="wa-sidebar-status">{{.OnlineCount}} online</span>
    </div>
    <div class="wa-sidebar-header-actions">
      <button onclick="showNewClientModal()" class="wa-sidebar-icon-btn" title="New Customer">
        <i class="fas fa-user-plus"></i>
      </button>
      <button onclick="waToggleSidebarMenu()" class="wa-sidebar-icon-btn" title="Menu">
        <i class="fas fa-ellipsis-v"></i>
      </button>
    </div>
  </div>

  <div id="sidebarMenuDropdown" class="hidden absolute top-14 right-2 z-50 w-56 card shadow-xl overflow-hidden py-1">
    <button onclick="showNewClientModal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[var(--color-text)] hover:bg-[var(--color-surface-secondary)] transition-colors">
      <i class="fas fa-user-plus w-5 text-center text-[var(--color-text-muted)]"></i>
      <span>New Customer</span>
    </button>
    <a href="/business/share" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[var(--color-text)] hover:bg-[var(--color-surface-secondary)] transition-colors">
      <i class="fas fa-share-alt w-5 text-center text-[var(--color-text-muted)]"></i>
      <span>Share Business</span>
    </a>
    <div class="border-t border-[var(--color-border-light)] my-1"></div>
    <a href="/business/logout" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[var(--color-error)] hover:bg-[var(--color-surface-secondary)] transition-colors">
      <i class="fas fa-sign-out-alt w-5 text-center"></i>
      <span>Logout</span>
    </a>
  </div>

  <div class="wa-search-container">
    <i class="fas fa-search wa-search-icon"></i>
    <input type="text" id="clientSearch" placeholder="Search or start new chat" oninput="filterClients()" class="wa-search-input">
  </div>

  {{ template "client-list" .}}
</aside>
<script>
function waToggleSidebarMenu() {
  var dd = document.getElementById('sidebarMenuDropdown');
  dd.classList.toggle('hidden');
}
document.addEventListener('click', function(e) {
  var btn = document.querySelector('.wa-sidebar-header-actions button:last-child');
  var dd = document.getElementById('sidebarMenuDropdown');
  if (dd && !dd.classList.contains('hidden') && btn && !btn.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.add('hidden');
  }
});
</script>
{{end}}
