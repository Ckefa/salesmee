{{define "wa_mobile_navbar"}}
<nav class="wa-mobile-navbar" id="waMobileNavbar">
  <a href="/business/dashboard" class="wa-mobile-brand">
    <div class="bg-white rounded-lg p-1 flex items-center">
      <img src="/static/images/salesmee.svg" alt="SalesMee" class="h-5 sm:h-7">
    </div>
  </a>
  <div class="wa-mobile-nav-items">
    <a href="/business/dashboard" class="wa-mobile-nav-item" data-nav="dashboard" title="Dashboard">
      <i class="fas fa-chart-line"></i>
    </a>
    {{if .AssistEnabled}}
    <button onclick="toggleAssist()" class="wa-mobile-nav-item" title="salesmee Assist">
      <i class="fas fa-wand-magic-sparkles"></i>
    </button>
    {{end}}
    <button onclick="toggleNotifications()" class="wa-mobile-nav-item" data-nav="notifications-mobile" title="Notifications">
      <i class="fas fa-bell"></i>
    </button>
    <a href="/business/share" class="wa-mobile-nav-item" title="Share">
      <i class="fas fa-share-alt"></i>
    </a>
    <button class="theme-toggle wa-mobile-nav-item" title="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>
    <a href="/business/logout" class="wa-mobile-nav-item" title="Logout">
      <i class="fas fa-sign-out-alt"></i>
    </a>
  </div>
</nav>
{{end}}
