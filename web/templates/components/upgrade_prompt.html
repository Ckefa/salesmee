{{define "components/upgrade_prompt"}}
<div id="upgrade-prompt" class="flex flex-col items-center justify-center py-16 px-4">
  <div class="w-16 h-16 rounded-full bg-[var(--color-warning-light)] flex items-center justify-center mb-4">
    {{heroicon "crown" "text-2xl" "text-[var(--color-warning)]"}}
  </div>
  <h3 class="text-lg font-semibold text-[var(--color-text)] mb-2">Upgrade Required</h3>
  <p class="text-sm text-[var(--color-text-secondary)] text-center max-w-sm mb-6">{{.FeatureMsg}}</p>
  <div class="flex gap-3">
    <a href="/business/subscription#plans" class="btn btn-primary btn-sm">
      {{heroicon "arrow-up" "mr-1"}} View Plans
    </a>
    <button onclick="history.back()" class="btn btn-ghost btn-sm">Go Back</button>
  </div>
</div>
{{end}}
