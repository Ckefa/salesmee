<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dist/styles.css?v=1">
  <script src="/static/js/core/theme.js?v=1"></script>
</head>
<body class="font-sans antialiased bg-slate-900 min-h-screen">
  <div class="flex min-h-screen">
    <div class="w-64 bg-slate-800 border-r border-slate-700 p-4 flex flex-col">
      <div class="flex items-center gap-2 mb-8 px-2">
        <div class="bg-white rounded-lg p-1"><img src="/static/images/salesmee.svg" alt="SalesMee" class="h-6 sm:h-8"></div>
        <span class="text-white font-bold text-sm">Admin Panel</span>
      </div>
      <nav class="space-y-1 flex-1">
        <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-chart-simple w-5"></i>Dashboard
        </a>
        <a href="/admin/businesses" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-store w-5"></i>Businesses
        </a>
        <a href="/admin/subscriptions" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-crown w-5"></i>Subscriptions
        </a>
        <a href="/admin/audit" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-teal-500/10 text-teal-400 text-sm font-medium">
          <i class="fas fa-history w-5"></i>Audit Log
        </a>
      </nav>
      <div class="border-t border-slate-700 pt-4">
        <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-500 hover:text-white text-sm transition-all">
          <i class="fas fa-arrow-left w-5"></i>Back to Site
        </a>
      </div>
    </div>

    <div class="flex-1 p-8 overflow-y-auto">
      <h1 class="text-2xl font-bold text-white mb-8">Audit Log</h1>

      <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400">
              <th class="text-left px-6 py-3 font-medium">Admin</th>
              <th class="text-left px-6 py-3 font-medium">Action</th>
              <th class="text-left px-6 py-3 font-medium">Resource</th>
              <th class="text-left px-6 py-3 font-medium">Resource ID</th>
              <th class="text-left px-6 py-3 font-medium">Date</th>
            </tr>
          </thead>
          <tbody>
            {{range .Logs}}
            <tr class="border-b border-slate-700/50 text-slate-300">
              <td class="px-6 py-4 font-medium">{{.Admin.Email}}</td>
              <td class="px-6 py-4">
                <span class="inline-block px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 text-xs capitalize">{{.Action}}</span>
              </td>
              <td class="px-6 py-4 text-slate-400">{{.Resource}}</td>
              <td class="px-6 py-4 text-slate-400">{{.ResourceID}}</td>
              <td class="px-6 py-4 text-slate-400">{{formatDate .CreatedAt}}</td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  {{template "csrf_script" .}}
</body>
</html>
