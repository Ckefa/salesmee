<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dist/styles.css?v=1">
  <script src="/static/js/core/theme.js?v=1"></script>
</head>
<body class="font-sans antialiased bg-slate-900 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-slate-800 border-r border-slate-700 p-4 flex flex-col">
      <div class="flex items-center gap-2 mb-8 px-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-teal-500 to-cyan-600 flex items-center justify-center">
          <i class="fas fa-shield-halved text-white text-xs"></i>
        </div>
        <span class="text-white font-bold text-sm">Admin Panel</span>
      </div>
      <nav class="space-y-1 flex-1">
        <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-teal-500/10 text-teal-400 text-sm font-medium">
          <i class="fas fa-chart-simple w-5"></i>Dashboard
        </a>
        <a href="/admin/businesses" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-store w-5"></i>Businesses
        </a>
        <a href="/admin/subscriptions" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-crown w-5"></i>Subscriptions
        </a>
        <a href="/admin/audit" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-700/50 hover:text-white text-sm transition-all">
          <i class="fas fa-history w-5"></i>Audit Log
        </a>
      </nav>
      <div class="border-t border-slate-700 pt-4">
        <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-500 hover:text-white text-sm transition-all">
          <i class="fas fa-arrow-left w-5"></i>Back to Site
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-y-auto">
      <h1 class="text-2xl font-bold text-white mb-8">Dashboard</h1>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
          <div class="flex items-center justify-between mb-4">
            <div class="w-10 h-10 rounded-xl bg-teal-500/20 flex items-center justify-center text-teal-400">
              <i class="fas fa-store"></i>
            </div>
          </div>
          <p class="text-3xl font-bold text-white">{{.TotalBusinesses}}</p>
          <p class="text-sm text-slate-400 mt-1">Total Businesses</p>
        </div>
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
          <div class="flex items-center justify-between mb-4">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 flex items-center justify-center text-cyan-400">
              <i class="fas fa-users"></i>
            </div>
          </div>
          <p class="text-3xl font-bold text-white">{{.TotalClients}}</p>
          <p class="text-sm text-slate-400 mt-1">Total Clients</p>
        </div>
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
          <div class="flex items-center justify-between mb-4">
            <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400">
              <i class="fas fa-shopping-cart"></i>
            </div>
          </div>
          <p class="text-3xl font-bold text-white">{{.TotalOrders}}</p>
          <p class="text-sm text-slate-400 mt-1">Total Orders</p>
        </div>
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
          <div class="flex items-center justify-between mb-4">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400">
              <i class="fas fa-crown"></i>
            </div>
          </div>
          <p class="text-3xl font-bold text-white">{{.TotalSubscriptions}}</p>
          <p class="text-sm text-slate-400 mt-1">Subscriptions</p>
        </div>
      </div>
    </div>
  </div>
  {{template "csrf_script" .}}
</body>
</html>
