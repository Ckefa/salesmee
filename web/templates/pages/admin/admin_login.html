<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dist/styles.css?v=1">
  <script src="/static/js/core/theme.js?v=1"></script>
</head>
<body class="font-sans antialiased bg-slate-900">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-2xl p-8 w-full max-w-sm border border-slate-700 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-teal-500 to-cyan-600 flex items-center justify-center mx-auto mb-4 shadow-lg">
          <i class="fas fa-shield-halved text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Admin Panel</h1>
        <p class="text-slate-400 mt-1 text-sm">Authorized personnel only</p>
      </div>

      {{if .Error}}
      <div class="bg-red-900/50 text-red-300 px-4 py-3 rounded-xl mb-4 flex items-center gap-2 text-sm border border-red-800">
        <i class="fas fa-exclamation-circle"></i>
        {{.Error}}
      </div>
      {{end}}

      <form method="POST" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
          <input type="email" name="email" required
            class="w-full px-4 py-2.5 rounded-xl bg-slate-700 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm"
            placeholder="admin@oneflow.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <input type="password" name="password" required
            class="w-full px-4 py-2.5 rounded-xl bg-slate-700 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm"
            placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
        </div>
        <button type="submit"
          class="w-full py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-600 text-white font-semibold hover:from-teal-600 hover:to-cyan-700 transition-all shadow-lg shadow-teal-500/20 text-sm">
          <i class="fas fa-lock-open mr-2 text-xs"></i>
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
          <i class="fas fa-arrow-left mr-1"></i>Back to OneFlow
        </a>
      </div>
    </div>
  </div>
  {{template "csrf_script" .}}
</body>
</html>
