<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dist/styles.css?v=1">
  <script src="/static/js/core/theme.js?v=1"></script>
  {{template "analytics_script" .}}
</head>
<body class="font-sans antialiased">
  <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-[var(--color-bg)]">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-primary) 10%, transparent);"></div>
      <div class="absolute -bottom-40 -left-40 w-[400px] h-[400px] rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-secondary) 10%, transparent); animation-delay: 4s;"></div>
    </div>

    <div class="card p-8 w-full max-w-md relative z-10 shadow-lg">
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br from-teal-500 to-cyan-600 shadow-lg shadow-teal-500/25 mb-4">
          <i class="fas fa-comments text-white text-xl"></i>
        </a>
        <h1 class="text-2xl font-bold text-[var(--color-text)]">Reset Password</h1>
        <p class="text-[var(--color-text-secondary)] mt-1 text-sm">Choose a new password for your account</p>
      </div>

      {{if .Error}}
      <div class="bg-[var(--color-error-light)] text-[var(--color-error)] px-4 py-3 rounded-xl mb-4 flex items-center gap-2 text-sm border" style="border-color: color-mix(in srgb, var(--color-error) 20%, transparent);">
        <i class="fas fa-exclamation-circle"></i>
        {{.Error}}
      </div>
      {{end}}

      <form method="POST" action="/business/reset-password" class="space-y-5">
        {{if .CSRFToken}}<input type="hidden" name="_csrf" value="{{.CSRFToken}}">{{end}}
        <input type="hidden" name="token" value="{{.Token}}">

        <div>
          <label for="password" class="block text-sm font-medium text-[var(--color-text-secondary)] mb-1.5">New Password</label>
          <div class="relative input-with-icon">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" name="password" required minlength="6"
              class="input"
              placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-[var(--color-text-muted)] hover:text-[var(--color-text-secondary)] transition-colors">
              <i class="fas fa-eye" id="pwIcon"></i>
            </button>
          </div>
          <p class="text-xs text-[var(--color-text-muted)] mt-1">At least 6 characters</p>
        </div>

        <button type="submit"
          class="btn btn-primary w-full">
          <i class="fas fa-check text-xs mr-2"></i>
          Reset Password
        </button>
      </form>

      <div class="text-center mt-6">
        <p class="text-sm text-[var(--color-text-secondary)]">
          <a href="/business/login" class="link font-medium">
            <i class="fas fa-arrow-left mr-1"></i>Back to Sign In
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      var pw = document.getElementById('password');
      var icon = document.getElementById('pwIcon');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'fas fa-eye'; }
    }
  </script>
  {{template "csrf_script" .}}
</body>
</html>
