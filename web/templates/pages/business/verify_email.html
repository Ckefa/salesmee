<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/dist/styles.css?v=1">
  <script src="/static/js/core/theme.js?v=1"></script>
  {{template "analytics_script" .}}
</head>
<body class="font-sans antialiased">
  <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-[var(--color-bg)]">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-primary) 10%, transparent);"></div>
      <div class="absolute -bottom-40 -left-40 w-[400px] h-[400px] rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-secondary) 10%, transparent); animation-delay: 4s;"></div>
    </div>

    <div class="card p-8 w-full max-w-md relative z-10 shadow-lg text-center">
      {{if .Success}}
      <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check text-emerald-600 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-[var(--color-text)] mb-2">Email Verified!</h1>
      <p class="text-[var(--color-text-secondary)] text-sm mb-6">{{.Success}}</p>
      <a href="/business/login" class="btn btn-primary inline-flex items-center">
        <i class="fas fa-arrow-right text-xs mr-2"></i>
        Go to Sign In
      </a>
      {{end}}

      {{if .Error}}
      <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-[var(--color-text)] mb-2">Verification Failed</h1>
      <p class="text-[var(--color-text-secondary)] text-sm mb-6">{{.Error}}</p>
      <p class="text-sm text-[var(--color-text-muted)]">
        Please try again or contact support.
      </p>
      {{end}}
    </div>
  </div>
</body>
</html>
