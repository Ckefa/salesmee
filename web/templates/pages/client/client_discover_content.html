<div class="flex flex-col h-full">
  <!-- Header -->
  <div class="bg-[var(--color-surface)] border-b border-[var(--color-border)] p-4 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-3">
      <button hx-get="/client" hx-target="#chat-area" hx-swap="innerHTML" hx-push-url="false" class="text-[var(--color-text-secondary)] hover:text-[var(--color-text)] flex items-center space-x-1 hide-mobile">
        <i class="fas fa-arrow-left text-lg"></i>
        <span class="text-sm">Chats</span>
      </button>
      <div class="w-10 h-10 bg-[var(--color-primary-light)] rounded-full flex items-center justify-center">
        <i class="fas fa-compass text-[var(--color-primary)]"></i>
      </div>
      <div>
        <h2 class="font-semibold text-[var(--color-text)]">Discover</h2>
        <p class="text-sm text-[var(--color-text-muted)]">Find businesses to connect with</p>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="p-4 border-b border-[var(--color-border)] flex-shrink-0">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <i class="fas fa-search text-[var(--color-text-muted)]"></i>
      </div>
      <input type="text" id="discoverSearchInput" placeholder="Search businesses by name, type, or slug..."
        class="input pl-12">
    </div>
  </div>

  <!-- Results -->
  <div class="flex-1 overflow-y-auto p-4" id="discover-results">
    {{range .Businesses}}
    <div class="business-card bg-[var(--color-surface)] rounded-xl border border-[var(--color-border)] p-4 flex items-center justify-between hover:shadow-md transition-shadow mb-3">
      <div class="flex items-center space-x-4 min-w-0 flex-1">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[var(--color-primary-light)] to-cyan-100 flex items-center justify-center overflow-hidden shrink-0">
          {{if .Logo}}
          <img src="/static/{{.Logo}}" alt="{{.Name}}" class="w-full h-full object-cover">
          {{else}}
          <i class="fas fa-store text-[var(--color-primary)] text-xl"></i>
          {{end}}
        </div>
        <div class="min-w-0">
          <h3 class="font-semibold text-[var(--color-text)] truncate">{{.Name}}</h3>
          <p class="text-sm text-[var(--color-text-muted)] capitalize truncate">{{.BusinessType}}</p>
          <p class="text-xs text-[var(--color-text-muted)] truncate">/b/{{.Slug}}</p>
        </div>
      </div>
      <button onclick="connectToDiscoverBusiness({{.ID}})"
        class="connect-btn shrink-0 px-4 py-2 bg-[var(--color-primary)] text-white rounded-lg hover:opacity-90 transition-colors text-sm font-medium min-h-[44px]">
        <i class="fas fa-plus mr-1"></i> Connect
      </button>
    </div>
    {{else}}
    <div class="text-center py-12 text-[var(--color-text-muted)]">
      <i class="fas fa-store text-5xl mb-4"></i>
      <p class="text-lg">No businesses available</p>
      <p class="text-sm mt-1">Check back later for new businesses to connect with</p>
    </div>
    {{end}}
  </div>
</div>

<script>
  var discoverSearchTimeout;

  document.getElementById('discoverSearchInput')?.addEventListener('input', function() {
    clearTimeout(discoverSearchTimeout);
    discoverSearchTimeout = setTimeout(() => {
      const q = this.value.trim();
      fetch('/client/discover/search?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(businesses => {
          const container = document.getElementById('discover-results');
          if (businesses.length === 0) {
            container.innerHTML = `
              <div class="text-center py-12 text-[var(--color-text-muted)]">
                <i class="fas fa-search text-5xl mb-4"></i>
                <p class="text-lg">No businesses found</p>
                <p class="text-sm mt-1">Try a different search term</p>
              </div>`;
            return;
          }
          container.innerHTML = businesses.map(b => `
            <div class="business-card bg-[var(--color-surface)] rounded-xl border border-[var(--color-border)] p-4 flex items-center justify-between hover:shadow-md transition-shadow mb-3">
              <div class="flex items-center space-x-4 min-w-0 flex-1">
                <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[var(--color-primary-light)] to-cyan-100 flex items-center justify-center overflow-hidden shrink-0">
                  ${b.logo ? '<img src="/static/' + b.logo + '" alt="' + b.name + '" class="w-full h-full object-cover">' : '<i class="fas fa-store text-[var(--color-primary)] text-xl"></i>'}
                </div>
                <div class="min-w-0">
                  <h3 class="font-semibold text-[var(--color-text)] truncate">${b.name}</h3>
                  <p class="text-sm text-[var(--color-text-muted)] capitalize truncate">${b.business_type || ''}</p>
                  <p class="text-xs text-[var(--color-text-muted)] truncate">/b/${b.slug}</p>
                </div>
              </div>
              <button onclick="connectToDiscoverBusiness(${b.id})"
                class="connect-btn shrink-0 px-4 py-2 bg-[var(--color-primary)] text-white rounded-lg hover:opacity-90 transition-colors text-sm font-medium min-h-[44px]">
                <i class="fas fa-plus mr-1"></i> Connect
              </button>
            </div>
          `).join('');
        });
    }, 300);
  });

  function connectToDiscoverBusiness(businessId) {
    const btn = event.target.closest('.connect-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Connecting...';

    fetch('/client/connect/' + businessId, { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          btn.innerHTML = '<i class="fas fa-check mr-1"></i> Connected!';
          btn.classList.remove('bg-[var(--color-primary)]', 'hover:opacity-90');
          btn.classList.add('bg-[var(--color-success)]');
          setTimeout(() => {
            window.location.href = '/client?business_id=' + businessId;
          }, 800);
        } else {
          btn.innerHTML = '<i class="fas fa-plus mr-1"></i> Connect';
          btn.disabled = false;
          alert(data.error || 'Failed to connect');
        }
      })
      .catch(() => {
        btn.innerHTML = '<i class="fas fa-plus mr-1"></i> Connect';
        btn.disabled = false;
        alert('Failed to connect');
      });
  }
</script>
