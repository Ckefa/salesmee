{{define "cookie_consent"}}
<div id="cookieBanner" class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 shadow-2xl px-4 py-4 hidden">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3 text-sm text-slate-600">
      {{heroicon "cake" "text-teal-500" "text-lg"}}
      <p>We use cookies to improve your experience. By using SalesMee, you agree to our <a href="/cookies" class="text-teal-600 underline font-medium">Cookie Policy</a>.</p>
    </div>
    <div class="flex items-center gap-3 flex-shrink-0">
      <button onclick="acceptCookies()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-600 text-white text-sm font-semibold hover:from-teal-600 hover:to-cyan-700 transition-all">
        Accept
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (!localStorage.getItem('cookies_accepted')) {
      document.getElementById('cookieBanner').classList.remove('hidden');
    }
  });
  function acceptCookies() {
    localStorage.setItem('cookies_accepted', 'true');
    document.getElementById('cookieBanner').classList.add('hidden');
  }
</script>
{{end}}
