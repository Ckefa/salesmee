{{define "dashboard_scripts"}}
<script src="/static/js/modules/assist.js?v=1"></script>
<script src="/static/js/core/app.js?v=1"></script>
{{template "business_profile_script" .}}
<script>
  var orderProductsList = [];
  var bookingServicesList = [];

  function renderOrderProducts(filter) {
    var container = document.getElementById('orderProductResults');
    var countEl = document.getElementById('orderProductCount');
    var selectedId = document.getElementById('orderProduct').value;
    var filtered = filter ? orderProductsList.filter(function(p) { return p.name.toLowerCase().includes(filter.toLowerCase()); }) : orderProductsList;
    var selectedNameEl = document.getElementById('orderProductSelectedName');
    var selectedName = selectedNameEl ? selectedNameEl.textContent : '';
    container.innerHTML = filtered.length ? filtered.map(function(p) {
      var isSelected = String(p.id) === selectedId;
      return '<div data-id="' + p.id + '" data-name="' + p.name.replace(/'/g, '&#39;') + '" onclick="selectOrderProduct(this)" class="px-3 py-2 rounded-lg cursor-pointer transition text-sm flex items-center gap-2 ' + (isSelected ? 'bg-[var(--color-warning-light)] text-[var(--color-warning)] font-medium' : 'hover:bg-[var(--color-surface-secondary)] text-[var(--color-text)]') + '">' + (isSelected ? '<i class="fas fa-check-circle text-xs"></i>' : '<i class="fas fa-circle text-xs text-[var(--color-surface-tertiary)]"></i>') + p.name + '</div>';
    }).join('') : '<div class="px-3 py-4 text-center text-xs text-[var(--color-text-muted)]">No products found</div>';
    countEl.textContent = filtered.length + ' of ' + orderProductsList.length + ' products';
  }
  function selectOrderProduct(el) {
    var id = el.dataset.id;
    var name = el.dataset.name;
    document.getElementById('orderProduct').value = id;
    document.getElementById('orderProductSelectedName').textContent = name;
    document.getElementById('orderProductSelected').classList.remove('hidden');
    renderOrderProducts(document.getElementById('orderProductSearch').value);
  }

  function renderBookingServices(filter) {
    var container = document.getElementById('bookingServiceResults');
    var countEl = document.getElementById('bookingServiceCount');
    var selectedId = document.getElementById('bookingService').value;
    var filtered = filter ? bookingServicesList.filter(function(s) { return s.name.toLowerCase().includes(filter.toLowerCase()); }) : bookingServicesList;
    container.innerHTML = filtered.length ? filtered.map(function(s) {
      var isSelected = String(s.id) === selectedId;
      return '<div data-id="' + s.id + '" data-name="' + s.name.replace(/'/g, '&#39;') + '" onclick="selectBookingService(this)" class="px-3 py-2 rounded-lg cursor-pointer transition text-sm flex items-center gap-2 ' + (isSelected ? 'bg-[var(--color-secondary-light)] text-[var(--color-secondary)] font-medium' : 'hover:bg-[var(--color-surface-secondary)] text-[var(--color-text)]') + '">' + (isSelected ? '<i class="fas fa-check-circle text-xs"></i>' : '<i class="fas fa-circle text-xs text-[var(--color-surface-tertiary)]"></i>') + s.name + '</div>';
    }).join('') : '<div class="px-3 py-4 text-center text-xs text-[var(--color-text-muted)]">No services found</div>';
    countEl.textContent = filtered.length + ' of ' + bookingServicesList.length + ' services';
  }
  function selectBookingService(el) {
    var id = el.dataset.id;
    var name = el.dataset.name;
    document.getElementById('bookingService').value = id;
    document.getElementById('bookingServiceSelectedName').textContent = name;
    document.getElementById('bookingServiceSelected').classList.remove('hidden');
    renderBookingServices(document.getElementById('bookingServiceSearch').value);
  }

  async function loadProductsForOrder() {
    try {
      var response = await fetch('/business/products');
      var data = await response.text();
      var parser = new DOMParser();
      var doc = parser.parseFromString(data, 'text/html');
      var productCards = doc.querySelectorAll('[data-product-id]');
      orderProductsList = [];
      productCards.forEach(function(card) {
        orderProductsList.push({
          id: card.dataset.productId,
          name: card.querySelector('h3')?.textContent || 'Unknown Product'
        });
      });
      document.getElementById('orderProduct').value = '';
      document.getElementById('orderProductSelected').classList.add('hidden');
      document.getElementById('orderProductSearch').value = '';
      renderOrderProducts('');
    } catch (error) { console.error('Failed to load products:', error); }
  }

  async function loadServicesForBooking() {
    try {
      var response = await fetch('/business/services');
      var data = await response.text();
      var parser = new DOMParser();
      var doc = parser.parseFromString(data, 'text/html');
      var serviceCards = doc.querySelectorAll('[data-service-id]');
      bookingServicesList = [];
      serviceCards.forEach(function(card) {
        bookingServicesList.push({
          id: card.dataset.serviceId,
          name: card.querySelector('h3')?.textContent || 'Unknown Service'
        });
      });
      document.getElementById('bookingService').value = '';
      document.getElementById('bookingServiceSelected').classList.add('hidden');
      document.getElementById('bookingServiceSearch').value = '';
      renderBookingServices('');
    } catch (error) { console.error('Failed to load services:', error); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var ordSearch = document.getElementById('orderProductSearch');
    if (ordSearch) ordSearch.addEventListener('input', function() { renderOrderProducts(this.value); });
    var bkgSearch = document.getElementById('bookingServiceSearch');
    if (bkgSearch) bkgSearch.addEventListener('input', function() { renderBookingServices(this.value); });
  });

  function showQuickOrderModal() {
    document.getElementById('quickOrderModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    ordGoToStep(1);
    loadProductsForOrder();
  }
  function hideQuickOrderModal() {
    document.getElementById('quickOrderModal').classList.add('hidden');
    document.body.style.overflow = '';
    document.getElementById('quickOrderForm').reset();
  }
  function showQuickBookingModal() {
    document.getElementById('quickBookingModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    bkgGoToStep(1);
    loadServicesForBooking();
  }
  function hideQuickBookingModal() {
    document.getElementById('quickBookingModal').classList.add('hidden');
    document.body.style.overflow = '';
    document.getElementById('quickBookingForm').reset();
  }

  // --- Order Step Navigation ---
  var ordStep = 1;
  function ordGoToStep(step) {
    ordStep = step;
    document.getElementById('ordStep1').classList.toggle('hidden', step !== 1);
    document.getElementById('ordStep2').classList.toggle('hidden', step !== 2);
    document.getElementById('ordStep3').classList.toggle('hidden', step !== 3);
    document.getElementById('ordBackBtn').classList.toggle('hidden', step === 1);
    document.getElementById('ordNextBtn').classList.toggle('hidden', step === 3);
    document.getElementById('ordSubmitBtn').classList.toggle('hidden', step !== 3);

    for (var i = 1; i <= 3; i++) {
      var ind = document.getElementById('ordStep' + i + 'Indicator');
      var lbl = document.getElementById('ordStep' + i + 'Label');
      var active = i <= step;
      ind.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 ' + (active ? 'bg-[var(--color-warning)] text-white shadow-sm' : 'bg-[var(--color-surface-tertiary)] text-[var(--color-text-muted)]');
      ind.innerHTML = (active && i < step) ? '<i class="fas fa-check text-[10px]"></i>' : String(i);
      if (lbl) lbl.className = 'text-xs font-medium transition-colors duration-300 ' + (active ? 'text-[var(--color-warning)]' : 'text-[var(--color-text-muted)]');
    }
    document.getElementById('ordStep1to2').className = 'w-8 sm:w-12 h-px mx-2 transition-colors duration-300 ' + (step >= 2 ? 'bg-[var(--color-warning)]' : 'bg-[var(--color-border)]');
    document.getElementById('ordStep2to3').className = 'w-8 sm:w-12 h-px mx-2 transition-colors duration-300 ' + (step >= 3 ? 'bg-[var(--color-warning)]' : 'bg-[var(--color-border)]');

    if (step === 3) ordRenderSummary();
  }
  function ordNextStep() {
    if (ordStep === 1) {
      if (!document.getElementById('orderProduct').value || !document.getElementById('orderQuantity').value) {
        showNotification('Please select a product and enter quantity', 'warning');
        return;
      }
      ordGoToStep(2);
    } else if (ordStep === 2) {
      if (!document.getElementById('orderCustomerName').value) {
        showNotification('Please enter customer name', 'warning');
        return;
      }
      ordGoToStep(3);
    }
  }
  function ordRenderSummary() {
    var nameEl = document.getElementById('orderProductSelectedName');
    document.getElementById('ordConfirmProduct').textContent = nameEl.textContent || '\u2014';
    document.getElementById('ordConfirmQty').textContent = document.getElementById('orderQuantity').value || '\u2014';
    document.getElementById('ordConfirmCustomer').textContent = document.getElementById('orderCustomerName').value || '\u2014';
  }

  // --- Booking Step Navigation ---
  var bkgStep = 1;
  function bkgGoToStep(step) {
    bkgStep = step;
    document.getElementById('bkgStep1').classList.toggle('hidden', step !== 1);
    document.getElementById('bkgStep2').classList.toggle('hidden', step !== 2);
    document.getElementById('bkgStep3').classList.toggle('hidden', step !== 3);
    document.getElementById('bkgBackBtn').classList.toggle('hidden', step === 1);
    document.getElementById('bkgNextBtn').classList.toggle('hidden', step === 3);
    document.getElementById('bkgSubmitBtn').classList.toggle('hidden', step !== 3);

    for (var i = 1; i <= 3; i++) {
      var ind = document.getElementById('bkgStep' + i + 'Indicator');
      var lbl = document.getElementById('bkgStep' + i + 'Label');
      var active = i <= step;
      ind.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 ' + (active ? 'bg-[var(--color-secondary)] text-white shadow-sm' : 'bg-[var(--color-surface-tertiary)] text-[var(--color-text-muted)]');
      ind.innerHTML = (active && i < step) ? '<i class="fas fa-check text-[10px]"></i>' : String(i);
      if (lbl) lbl.className = 'text-xs font-medium transition-colors duration-300 ' + (active ? 'text-[var(--color-secondary)]' : 'text-[var(--color-text-muted)]');
    }
    document.getElementById('bkgStep1to2').className = 'w-8 sm:w-12 h-px mx-2 transition-colors duration-300 ' + (step >= 2 ? 'bg-[var(--color-secondary)]' : 'bg-[var(--color-border)]');
    document.getElementById('bkgStep2to3').className = 'w-8 sm:w-12 h-px mx-2 transition-colors duration-300 ' + (step >= 3 ? 'bg-[var(--color-secondary)]' : 'bg-[var(--color-border)]');

    if (step === 3) bkgRenderSummary();
  }
  function bkgNextStep() {
    if (bkgStep === 1) {
      if (!document.getElementById('bookingService').value) {
        showNotification('Please select a service', 'warning');
        return;
      }
      bkgGoToStep(2);
    } else if (bkgStep === 2) {
      if (!document.getElementById('bookingDateTime').value || !document.getElementById('bookingCustomerName').value) {
        showNotification('Please fill in date/time and customer name', 'warning');
        return;
      }
      bkgGoToStep(3);
    }
  }
  function bkgRenderSummary() {
    var nameEl = document.getElementById('bookingServiceSelectedName');
    document.getElementById('bkgConfirmService').textContent = nameEl.textContent || '\u2014';
    var dt = document.getElementById('bookingDateTime').value;
    document.getElementById('bkgConfirmDateTime').textContent = dt ? new Date(dt).toLocaleString() : '\u2014';
    document.getElementById('bkgConfirmCustomer').textContent = document.getElementById('bookingCustomerName').value || '\u2014';
  }

  document.getElementById('quickOrderForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    var locParams = new URLSearchParams(window.location.search);
    var curLocId = locParams.get('location_id');
    var orderData = {
      product_id: parseInt(document.getElementById('orderProduct').value),
      quantity: parseInt(document.getElementById('orderQuantity').value),
      customer_name: document.getElementById('orderCustomerName').value,
      customer_email: document.getElementById('orderCustomerEmail').value,
      customer_phone: document.getElementById('orderCustomerPhone').value,
      delivery_address: document.getElementById('orderDeliveryAddress').value,
      notes: document.getElementById('orderNotes').value,
      mark_completed: document.getElementById('orderCompleted').checked,
      location_id: curLocId ? parseInt(curLocId) : null
    };
    fetch('/business/orders', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCookie('csrf_token') }, body: JSON.stringify(orderData) })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          hideQuickOrderModal();
          showNotification(data.message || 'Order created!', 'success');
          if (window.htmx && document.getElementById('orders-content')) {
            htmx.ajax('GET', '/business/orders', {target: '#orders-content', swap: 'outerHTML'});
          } else if (window.htmx && document.getElementById('main-content')) {
            htmx.ajax('GET', '/business/dashboard', {target: '#main-content', swap: 'innerHTML'});
          }
        }
        else { showNotification(data.error || 'Failed', 'error'); }
      })
      .catch(function() { showNotification('Failed to create order', 'error'); });
  });

  document.getElementById('quickBookingForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    var locParams = new URLSearchParams(window.location.search);
    var curLocId = locParams.get('location_id');
    var bookingData = {
      service_id: parseInt(document.getElementById('bookingService').value),
      customer_name: document.getElementById('bookingCustomerName').value,
      customer_email: document.getElementById('bookingCustomerEmail').value,
      customer_phone: document.getElementById('bookingCustomerPhone').value,
      booking_date: document.getElementById('bookingDateTime').value,
      notes: document.getElementById('bookingNotes').value,
      mark_completed: document.getElementById('bookingCompleted').checked,
      location_id: curLocId ? parseInt(curLocId) : null
    };
    fetch('/business/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCookie('csrf_token') }, body: JSON.stringify(bookingData) })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          hideQuickBookingModal();
          showNotification(data.message || 'Booking created!', 'success');
          if (window.htmx && document.getElementById('bookings-content')) {
            htmx.ajax('GET', '/business/bookings', {target: '#bookings-content', swap: 'outerHTML'});
          } else if (window.htmx && document.getElementById('main-content')) {
            htmx.ajax('GET', '/business/dashboard', {target: '#main-content', swap: 'innerHTML'});
          }
        }
        else { showNotification(data.error || 'Failed', 'error'); }
      })
      .catch(function() { showNotification('Failed to create booking', 'error'); });
  });
</script>
{{template "csrf_script" .}}
{{end}}
