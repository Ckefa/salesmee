      </div>
      <div class="hidden sm:block w-px h-10 bg-slate-300"></div>

          <i class="fas fa-user-tie"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Founder</p>
          <a href="mailto:ckefa65@gmail.com" class="text-sm text-slate-700 hover:text-teal-600 font-medium transition-colors">ckefa65@gmail.com</a>

      </div>
